# Publica un release de GitHub con instaladores para Windows, macOS (Apple Silicon e Intel) y Linux,
# junto con el `latest.json` del auto-update. Se dispara al subir una etiqueta `v*`:
#
#   bun scripts/set-version.mjs 0.2.0   # cambia la versión en todos los sitios
#   git commit -am "v0.2.0" && git tag v0.2.0 && git push --tags
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD   firma del auto-update (opcional: sin ellos solo se omite el auto-update)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                          firma y notarización de macOS (opcional)
# Variables del repositorio:
#   TAURI_UPDATER_PUBKEY        clave PÚBLICA del auto-update (la que imprime `bun tauri signer generate`); obligatoria si hay clave privada
#   HIVEBUZZ_SPOTIFY_CLIENT_ID  Client ID de Spotify integrado (opcional; ver README)
#   HIVEBUZZ_TWITCH_CLIENT_ID   botón «Entrar con Twitch» (opcional)
#
# NOTA: este flujo no se ha ejecutado todavía; revísalo en el primer release (queda como borrador).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  # Comprobaciones previas y un único borrador de release para todas las plataformas (si cada job creara el
  # suyo, dos jobs simultáneos podrían duplicarlo o pisarse el `latest.json`).
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: La etiqueta coincide con la versión
        shell: bash
        run: |
          bun scripts/set-version.mjs --show
          want="${GITHUB_REF_NAME#v}"
          have="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")).version)')"
          if [ "$want" != "$have" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME pero tauri.conf.json dice $have. Ejecuta 'bun scripts/set-version.mjs $want', haz commit y vuelve a etiquetar."
            exit 1
          fi

      - name: Firma del auto-update con su clave pública
        shell: bash
        env:
          HAS_PRIVATE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          conf="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")).plugins?.updater?.pubkey ?? "")')"
          if [ "$HAS_PRIVATE" = "true" ] && [ -z "$PUBKEY" ] && [ -z "$conf" ]; then
            echo "::error::Hay clave privada de firma pero ninguna clave pública: las apps instaladas rechazarían todas las actualizaciones. Define la variable TAURI_UPDATER_PUBKEY."
            exit 1
          fi

      - name: Borrador del release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Si ya hay un release (borrador o no) de esta etiqueta, se reutiliza; si no, se crea y se usa el id que devuelve
          # la API (buscarlo después en la lista falla: los borradores tardan en aparecer).
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name)"' || true)"
          echo "Releases existentes:"; echo "${existing:-(ninguno)}"
          id="$(echo "$existing" | awk -v t="$GITHUB_REF_NAME" '$2 == t { print $1; exit }')"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="HiveBuzz $GITHUB_REF_NAME" \
              -f body="Consulta CHANGELOG.md para ver los cambios." -F draft=true --jq .id)"
          fi
          [ -n "$id" ] || { echo "::error::No se pudo crear ni encontrar el release de $GITHUB_REF_NAME"; exit 1; }
          echo "Release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-15-intel # Intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev libssl-dev pkg-config

      - run: bun install --frozen-lockfile
      - run: cd sidecar && bun install --frozen-lockfile

      # El sidecar se compila para el mismo target que la app (nombre exigido por Tauri: tiktok-sidecar-<triple>).
      - name: Sidecar
        run: bun run sidecar:build
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      # La clave pública del auto-update entra en la configuración de release (la de desarrollo la deja vacía).
      - name: Clave pública del auto-update
        if: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          bun -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.release.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.plugins = { ...c.plugins, updater: { ...(c.plugins?.updater ?? {}), pubkey: process.env.PUBKEY.trim() } };
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      # Los secretos opcionales (firma del auto-update y de macOS) solo se exportan si tienen valor: Tauri trata una
      # variable definida pero VACÍA como un valor real (p. ej. una identidad de firma "") y la compilación de macOS falla.
      - name: Exportar secretos opcionales
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            delim="EOF_$RANDOM$RANDOM"
            { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIVEBUZZ_SPOTIFY_CLIENT_ID: ${{ vars.HIVEBUZZ_SPOTIFY_CLIENT_ID }}
          HIVEBUZZ_TWITCH_CLIENT_ID: ${{ vars.HIVEBUZZ_TWITCH_CLIENT_ID }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Sin clave de firma (secreto vacío) se publican los instaladores igualmente, sin los archivos del auto-update.
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.release.conf.json' || '' }} ${{ matrix.args }}
