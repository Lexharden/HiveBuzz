<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HiveBuzz · Alertas</title>
<!--HB_COMMON-->
<style>
  #hb-root { align-items: center; max-width: 90vw; }
  .alert { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
           text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85); }
  .alert.pop { animation: a-pop 0.35s ease-out; }
  .alert.slide { animation: a-slide 0.4s ease-out; }
  .alert.fade { animation: a-fade-in 0.5s ease-out; }
  .alert.out { animation: a-out 0.45s ease-in forwards; }
  .alert .media { max-height: 45vh; border-radius: 14px; }
  .alert .who { display: flex; align-items: center; gap: 10px; }
  .alert .who img { width: 44px; height: 44px; border-radius: 50%; }
  .alert .title { font-weight: 800; color: var(--hb-accent); line-height: 1.1; }
  .alert .text { font-weight: 600; line-height: 1.2; word-break: break-word; }
  @keyframes a-pop { from { transform: scale(0.85) translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes a-slide { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes a-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes a-out { to { opacity: 0; transform: translateY(-10px); } }
</style>
</head>
<body data-anchor="center">
<div id="hb-root"></div>
<div id="hb-dot" title="Sin conexión con HiveBuzz"></div>
<script>
(function () {
  "use strict";
  var cfg = {
    titleSize: 40, textSize: 30, mediaMaxWidth: 60, animation: "pop",
    autoGift: true, minCoins: 1, autoFollow: true, autoSubscribe: true, autoShare: false, autoDurationSec: 5
  };
  var root = document.getElementById("hb-root");
  var queue = [], showing = false, MAX_QUEUE = 50;
  // Eventos que muestran una alerta por sí solos (sin reglas), con el interruptor que los controla.
  var AUTO = { gift: "autoGift", follow: "autoFollow", subscribe: "autoSubscribe", share: "autoShare" };

  // Quita el fondo de un vídeo sin canal alfa pintándolo en un canvas y calculando la transparencia de cada
  // píxel: «black» según el brillo (el color se «des-premultiplica» para que brillos y humo queden bien) y
  // «green» según cuánto domina el verde (con corrección del reflejo verde en los bordes).
  var KEY_MAX_W = 960;
  function keyedVideo(video, mode) {
    var canvas = HB.el("canvas", "media");
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    var busy = false;
    function frame() {
      if (!canvas.isConnected && canvas.dataset.live) return;
      if (video.videoWidth && !busy) {
        busy = true;
        var k = Math.min(1, KEY_MAX_W / video.videoWidth);
        var w = Math.round(video.videoWidth * k), h = Math.round(video.videoHeight * k);
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        ctx.drawImage(video, 0, 0, w, h);
        var img = ctx.getImageData(0, 0, w, h), d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i], g = d[i + 1], b = d[i + 2];
          if (mode === "black") {
            var m = r > g ? (r > b ? r : b) : (g > b ? g : b);
            var al = m < 12 ? 0 : (m > 60 ? 255 : (m - 12) * 255 / 48);
            if (al > 0) { var f = 255 / m; d[i] = r * f; d[i + 1] = g * f; d[i + 2] = b * f; }
            d[i + 3] = al;
          } else {
            var rb = r > b ? r : b, dom = g - rb;
            d[i + 3] = dom < 25 ? 255 : (dom > 90 ? 0 : 255 - (dom - 25) * 255 / 65);
            if (g > rb) d[i + 1] = rb;
          }
        }
        ctx.putImageData(img, 0, 0);
        busy = false;
      }
      if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(frame); else requestAnimationFrame(frame);
    }
    canvas.dataset.live = "1";
    video.addEventListener("playing", frame, { once: true });
    return canvas;
  }

  function build(a) {
    // La animación y la escala de la propia alerta mandan sobre las de la pantalla.
    var anim = /^(pop|slide|fade)$/.test(a.animation) ? a.animation : (cfg.animation || "pop");
    var el = HB.el("div", "alert " + anim);
    if (Number(a.scale) > 0) el.style.zoom = String(HB.clamp(Number(a.scale), 40, 250) / 100);
    var m = a.media;
    if (m && HB.isLocalMedia(m.url)) {
      var src = m.url + "?token=" + encodeURIComponent(HB.token);
      var node;
      if (m.kind === "video") {
        node = HB.el("video", "media");
        node.src = src; node.autoplay = true; node.loop = true; node.muted = true; node.playsInline = true;
        a.videoNode = node;
        if (a.keyMode === "black" || a.keyMode === "green") {
          // El vídeo se reproduce fuera de la página y lo que se ve es el canvas ya sin fondo.
          var shown = keyedVideo(node, a.keyMode);
          node.play().catch(function () {});
          node = shown;
        }
      } else {
        node = HB.el("img", "media");
        node.src = src;
      }
      node.style.maxWidth = cfg.mediaMaxWidth + "vw";
      el.appendChild(node);
    } else {
      var gi = HB.img(a.imageUrl, "media");
      if (gi) { gi.style.maxHeight = "25vh"; el.appendChild(gi); }
    }
    var avatar = HB.img(a.avatar, "");
    if (a.title || avatar) {
      var who = HB.el("div", "who");
      if (avatar) who.appendChild(avatar);
      if (a.title) { var t = HB.el("div", "title", a.title); t.style.fontSize = cfg.titleSize + "px"; who.appendChild(t); }
      el.appendChild(who);
    }
    if (a.text) { var x = HB.el("div", "text", a.text); x.style.fontSize = cfg.textSize + "px"; el.appendChild(x); }
    return el;
  }

  // Si la alerta lleva sonido, HiveBuzz lo hace sonar cuando se le avisa de que ya se ve: con vídeo, cuando
  // empieza a reproducirse (no antes, que tarda en cargar); sin vídeo, al instante. Tope de 3 s por si no arranca.
  function announce(a) {
    if (!a.sync || !a.id) return;
    var done = false;
    function go() { if (!done) { done = true; HB.shown(a.id); } }
    var v = a.videoNode;
    if (v) {
      v.addEventListener("playing", go, { once: true });
      setTimeout(go, 3000);
    } else {
      requestAnimationFrame(go);
    }
  }

  function next() {
    if (showing || queue.length === 0) return;
    showing = true;
    var a = queue.shift();
    var el = build(a);
    root.appendChild(el);
    announce(a);
    var ms = HB.clamp(Number(a.durationMs) || 5000, 500, 60000);
    setTimeout(function () {
      el.classList.remove("pop", "slide", "fade");
      el.classList.add("out");
      setTimeout(function () { el.remove(); showing = false; next(); }, 480);
    }, ms);
  }

  function enqueue(a) {
    if (queue.length < MAX_QUEUE) queue.push(a);
    next();
  }

  /** Alerta automática de un evento. El historial que llega al abrir el overlay no dispara nada. */
  function autoAlert(ev, replay) {
    var flag = AUTO[ev.type];
    if (replay || !flag || !cfg[flag]) return;
    var u = ev.user || {};
    var text;
    if (ev.type === "gift") {
      var g = ev.gift || {};
      if ((Number(g.coins) || 0) < (Number(cfg.minCoins) || 0)) return;
      text = HB.t("ev.gift", { count: g.count, name: g.name });
    } else {
      text = HB.t("ev." + ev.type, {});
    }
    enqueue({
      title: u.nickname || u.uniqueId || "",
      text: text,
      avatar: u.avatar,
      imageUrl: ev.gift && ev.gift.image,
      durationMs: (Number(cfg.autoDurationSec) || 5) * 1000
    });
  }

  HB.start({
    id: "alerts",
    onConfig: function (c) { cfg = c; },
    onEvent: autoAlert,
    onOverlay: function (channel, data) {
      if (channel !== "alerts" || !data) return;
      enqueue(data);
    }
  });
})();
</script>
</body>
</html>
