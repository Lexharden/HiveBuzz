<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HiveBuzz · Jarrón de regalos</title>
<!--HB_COMMON-->
<style>
  #hb-root { align-items: center; gap: 8px; }
  .jar-wrap { position: relative; }
  .jar-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .liquid { transition: transform 0.9s ease-out; }
  .wave { animation: jar-wave 2.4s linear infinite; }
  .wave.still { animation: none; }
  @keyframes jar-wave { from { transform: translateX(0); } to { transform: translateX(-100px); } }
  .bubble { fill: rgba(255,255,255,0.45); animation: jar-bubble 4s ease-in infinite; }
  @keyframes jar-bubble {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-90px); opacity: 0; }
  }
  .drop { position: absolute; left: 50%; top: 0; width: 15%; margin-left: -7.5%; object-fit: contain; pointer-events: none; opacity: 0; line-height: 1; text-align: center; animation: jar-fall 1.1s ease-in forwards; }
  @keyframes jar-fall {
    0% { transform: translateY(-40%); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(var(--end, 60%)); opacity: 0; }
  }
  .jar-wrap.full svg, .jar-wrap.pop svg { animation: hb-pulse 1.4s ease-in-out infinite; }
  .confetti { position: absolute; top: 20%; width: 8px; height: 12px; pointer-events: none; opacity: 0; animation: jar-confetti 1.8s ease-out forwards; }
  @keyframes jar-confetti {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx, 0), 220px) rotate(540deg); opacity: 0; }
  }
  .totals { text-align: center; line-height: 1.2; }
  .title { font-size: 1.2em; font-weight: 800; }
  .usd { font-size: 1.9em; font-weight: 800; }
  .nums { opacity: 0.85; font-weight: 600; }
  .pct { opacity: 0.85; font-weight: 700; }
  .est { opacity: 0.6; font-size: 0.75em; }
  .hint { opacity: 0.7; font-size: 0.8em; max-width: 240px; text-align: center; }
</style>
</head>
<body data-anchor="bottom-left">
<div id="hb-root"></div>
<div id="hb-dot" title="Sin conexión con HiveBuzz"></div>
<script>
(function () {
  "use strict";
  var cfg = {
    shape: "jar", jarSize: 320, liquidColor: "#ffc113", liquidColor2: "#ff8a00", glassColor: "#ffffff", glassOpacity: 100,
    showLid: true, lidColor: "#ffffff", waves: true, bubbles: true, fillSpeed: 0.9, title: "", labelPosition: "below",
    showPercent: false, source: "own", target: 10000, onFull: "keep", fullEffect: "pulse", goalId: "", showGoal: true,
    showUsd: true, usdPerCoin: 0.005, currencySymbol: "$", dropGifts: true, dropMode: "gift", dropSize: 15, minCoins: 1
  };
  var SVG = "http://www.w3.org/2000/svg";
  // Cada forma: contorno, rango vertical del interior (en unidades del viewBox 200×260), brillo, tapa y asa.
  var SHAPES = {
    jar: { d: "M62 32 V52 C62 56 30 62 30 90 V220 C30 236 42 246 58 246 H142 C158 246 170 236 170 220 V90 C170 62 138 56 138 52 V32 Z", top: 56, bottom: 246, shine: "M44 100 V210", lid: [55, 12, 90, 20] },
    bottle: { d: "M82 20 V70 C82 82 40 92 40 130 V228 C40 240 48 248 60 248 H140 C152 248 160 240 160 228 V130 C160 92 118 82 118 70 V20 Z", top: 24, bottom: 248, shine: "M54 130 V225", lid: [76, 4, 48, 16] },
    mug: { d: "M30 50 H150 V210 C150 232 136 246 114 246 H66 C44 246 30 232 30 210 Z", top: 54, bottom: 246, shine: "M44 70 V210", lid: [24, 40, 132, 12], handle: "M150 90 H172 C192 90 192 180 150 180" },
    heart: { d: "M100 240 C20 180 20 90 60 70 C85 58 100 80 100 90 C100 80 115 58 140 70 C180 90 180 180 100 240 Z", top: 62, bottom: 240, shine: "M48 100 C42 120 44 140 56 160", lid: null },
    cylinder: { d: "M45 40 V225 C45 240 60 248 100 248 C140 248 155 240 155 225 V40 Z", top: 44, bottom: 248, shine: "M58 60 V220", lid: [38, 24, 124, 16] }
  };
  var CONFETTI = ["#ffc113", "#ff4d6d", "#4dd2ff", "#7cff6b", "#c77dff"];

  var goals = [];
  var jarCoins = 0, jarLaps = 0;
  var ready = false;        // Hasta el primer estado del jarrón no se celebra nada (evita confeti al cargar).
  var prevFull = false, prevLaps = 0;
  var shapeKey = "";
  var root = document.getElementById("hb-root");

  function svg(tag, attrs) {
    var n = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  function shape() { return SHAPES[cfg.shape] || SHAPES.jar; }
  function interior() { var sh = shape(); return sh.bottom - sh.top; }

  var wrap = HB.el("div", "jar-wrap");
  var totals = HB.el("div", "totals");
  var title = HB.el("div", "title");
  var usd = HB.el("div", "usd");
  var nums = HB.el("div", "nums");
  var pct = HB.el("div", "pct");
  var est = HB.el("div", "est");
  var hint = HB.el("div", "hint");
  [title, usd, nums, pct, est, hint].forEach(function (n) { totals.appendChild(n); });
  root.appendChild(wrap); root.appendChild(totals);

  // Elementos del dibujo que se actualizan sin reconstruir.
  var el = {};

  function waveD(amp) {
    var d = "M0 0";
    for (var i = 0; i < 4; i++) d += " Q" + (25 + 100 * i) + " " + (-amp) + " " + (50 + 100 * i) + " 0 T" + (100 + 100 * i) + " 0";
    return d + " V" + (interior() + 40) + " H0 Z";
  }

  // La estructura solo se rehace si cambia la forma (o la presencia de olas, burbujas o tapa); el resto son atributos.
  function build() {
    var sh = shape();
    var key = [cfg.shape, cfg.waves, cfg.bubbles, cfg.showLid].join("|");
    if (key === shapeKey) return;
    shapeKey = key;
    wrap.querySelectorAll("svg").forEach(function (n) { n.remove(); });
    var s = svg("svg", { viewBox: "0 0 200 260" });
    var defs = svg("defs");
    var clip = svg("clipPath", { id: "jar-clip" });
    clip.appendChild(svg("path", { d: sh.d }));
    var grad = svg("linearGradient", { id: "jar-grad", x1: "0", y1: "0", x2: "0", y2: "1" });
    el.stop1 = svg("stop", { offset: "0" });
    el.stop2 = svg("stop", { offset: "1" });
    grad.appendChild(el.stop1); grad.appendChild(el.stop2);
    defs.appendChild(clip); defs.appendChild(grad);
    s.appendChild(defs);
    el.body = svg("path", { d: sh.d });
    s.appendChild(el.body);
    var clipped = svg("g", { "clip-path": "url(#jar-clip)" });
    el.liquid = svg("g", { "class": "liquid" });
    el.waveG = svg("g", { "class": "wave" + (cfg.waves ? "" : " still") });
    el.wave = svg("path", { d: waveD(cfg.waves ? 5 : 0), fill: "url(#jar-grad)" });
    el.waveG.appendChild(el.wave);
    el.liquid.appendChild(el.waveG);
    if (cfg.bubbles) {
      for (var i = 0; i < 7; i++) {
        var b = svg("circle", { cx: String(45 + ((i * 37) % 110)), cy: String(interior() - 6), r: String(2 + (i % 3)), "class": "bubble" });
        b.style.animationDelay = (i * 0.55) + "s";
        b.style.animationDuration = (3 + (i % 4) * 0.7) + "s";
        el.liquid.appendChild(b);
      }
    }
    clipped.appendChild(el.liquid);
    s.appendChild(clipped);
    el.glass = svg("path", { d: sh.d, fill: "none", "stroke-width": "4", "stroke-linejoin": "round" });
    el.shine = svg("path", { d: sh.shine, fill: "none", "stroke-width": "5", "stroke-linecap": "round" });
    s.appendChild(el.glass); s.appendChild(el.shine);
    el.handle = sh.handle ? svg("path", { d: sh.handle, fill: "none", "stroke-width": "5", "stroke-linecap": "round" }) : null;
    if (el.handle) s.appendChild(el.handle);
    el.lid = cfg.showLid && sh.lid ? svg("rect", { x: sh.lid[0], y: sh.lid[1], width: sh.lid[2], height: sh.lid[3], rx: "5" }) : null;
    if (el.lid) s.appendChild(el.lid);
    wrap.insertBefore(s, wrap.firstChild);
  }

  function pickGoal() {
    if (cfg.goalId) {
      for (var i = 0; i < goals.length; i++) if (goals[i].id === cfg.goalId) return goals[i];
      return null;
    }
    for (var j = 0; j < goals.length; j++) if (goals[j].kind === "coins") return goals[j];
    return null;
  }

  // Monedas de la vuelta, objetivo, porcentaje (0–100) y monedas totales para estimar los dólares.
  function current() {
    if (cfg.source === "goal") {
      var g = pickGoal();
      var c = g ? Number(g.current) || 0 : 0;
      return { coins: c, target: g ? Number(g.target) || 0 : 0, pct: g ? HB.clamp(Number(g.percent) || 0, 0, 100) : 0, total: c, missing: !g };
    }
    var t = Number(cfg.target) || 0;
    var total = cfg.onFull === "reset" ? jarLaps * t + jarCoins : jarCoins;
    return { coins: jarCoins, target: t, pct: t > 0 ? HB.clamp((jarCoins / t) * 100, 0, 100) : 0, total: total, missing: false };
  }

  function money(coins) {
    var amount = coins * cfg.usdPerCoin;
    return cfg.currencySymbol + new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
  }

  function surfaceY(p) {
    return shape().top + (1 - p / 100) * interior();
  }

  function render() {
    build();
    var cur = current();
    var amp = cfg.waves ? 5 : 0;
    wrap.style.width = cfg.jarSize + "px";
    el.stop1.setAttribute("stop-color", cfg.liquidColor2);
    el.stop2.setAttribute("stop-color", cfg.liquidColor);
    el.body.setAttribute("fill", "rgba(255,255,255,0.08)");
    var glassAlpha = HB.clamp(Number(cfg.glassOpacity), 0, 100) / 100;
    [el.glass, el.shine, el.handle].forEach(function (n) {
      if (!n) return;
      n.setAttribute("stroke", cfg.glassColor);
      n.setAttribute("stroke-opacity", String(n === el.shine ? glassAlpha * 0.35 : glassAlpha));
    });
    if (el.lid) el.lid.setAttribute("fill", cfg.lidColor);
    el.liquid.style.transition = "transform " + cfg.fillSpeed + "s ease-out";
    // Vacío del todo, la cresta de la ola quedaría asomando: se baja un poco más.
    var y = surfaceY(cur.pct) + (cur.pct <= 0 ? amp + 2 : 0);
    el.liquid.style.transform = "translateY(" + Math.round(y * 100) / 100 + "px)";
    var isFull = cur.pct >= 100;
    wrap.classList.toggle("full", isFull && cfg.fullEffect === "pulse" && cfg.onFull !== "reset");

    title.style.display = cfg.title ? "" : "none";
    title.textContent = cfg.title;
    usd.style.display = cfg.showUsd ? "" : "none";
    est.style.display = cfg.showUsd ? "" : "none";
    usd.textContent = "≈ " + money(cur.total);
    est.textContent = HB.t("jar.estimate");
    nums.style.display = cfg.showGoal ? "" : "none";
    nums.textContent = cur.target > 0 ? HB.fmt(cur.coins) + " / " + HB.fmt(cur.target) + " " + HB.t("coins") : HB.fmt(cur.coins) + " " + HB.t("coins");
    pct.style.display = cfg.showPercent ? "" : "none";
    pct.textContent = Math.floor(cur.pct) + "%";
    hint.style.display = cur.missing && HB.preview ? "" : "none";
    hint.textContent = HB.t("jar.needGoal");
    totals.style.order = cfg.labelPosition === "above" ? "-1" : "1";

    // Celebración al llenarse o al completar una vuelta (nunca por la carga inicial).
    var lapped = cfg.source === "own" && jarLaps > prevLaps;
    if (ready && ((isFull && !prevFull) || lapped)) celebrate();
    prevFull = isFull;
    prevLaps = jarLaps;
  }

  function celebrate() {
    if (cfg.fullEffect === "pulse") {
      wrap.classList.add("pop");
      setTimeout(function () { wrap.classList.remove("pop"); }, 1500);
    } else if (cfg.fullEffect === "confetti") {
      for (var i = 0; i < 28; i++) {
        var c = HB.el("span", "confetti");
        c.style.left = (10 + Math.random() * 80) + "%";
        c.style.background = CONFETTI[i % CONFETTI.length];
        c.style.setProperty("--dx", Math.round((Math.random() - 0.5) * 120) + "px");
        c.style.animationDelay = (Math.random() * 0.4) + "s";
        wrap.appendChild(c);
        (function (n) { setTimeout(function () { n.remove(); }, 2400); })(c);
      }
    }
  }

  function drop(ev) {
    var node;
    if (cfg.dropMode === "coin") {
      node = HB.el("div", "drop");
      node.textContent = "🪙";
      node.style.fontSize = Math.max(10, Math.round((wrap.offsetWidth || cfg.jarSize) * cfg.dropSize / 100)) + "px";
    } else {
      node = HB.img(ev.gift.image, "drop");
    }
    if (!node) return;
    node.style.width = cfg.dropSize + "%";
    node.style.marginLeft = (-cfg.dropSize / 2) + "%";
    // Cae hasta la superficie actual del líquido.
    node.style.setProperty("--end", Math.round((surfaceY(current().pct) / 260) * wrap.offsetHeight) + "px");
    wrap.appendChild(node);
    setTimeout(function () { node.remove(); }, 1300);
  }

  function onEvent(ev, replay) {
    if (ev.type !== "gift" || !ev.gift) return;
    // La cuenta la lleva HiveBuzz (canal «jar»); aquí solo se anima la caída.
    if (!replay && cfg.dropGifts && ev.gift.coins >= cfg.minCoins) drop(ev);
  }

  render();
  HB.start({
    id: "jar",
    onConfig: function (c) { cfg = c; render(); },
    onEvent: onEvent,
    onOverlay: function (channel, d) {
      if (!d) return;
      if (channel === "goals" && Array.isArray(d.goals)) { goals = d.goals; render(); }
      else if (channel === "jar") {
        jarCoins = Number(d.coins) || 0;
        jarLaps = Number(d.laps) || 0;
        render();
        ready = true;
      }
    }
  });
})();
</script>
</body>
</html>
