[package]
name = "hive-buzz"
version = "0.5.4"
description = "HiveBuzz: alertas, TTS y automatización para TikTok LIVE"
authors = ["HiveBuzz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# El sufijo `_lib` evita el choque de nombres entre la biblioteca y el binario en Windows
# (https://github.com/rust-lang/cargo/issues/8519). Solo `rlib`: `staticlib` y `cdylib` hacen falta
# únicamente para iOS/Android, y compilarlas en escritorio alarga cada build.
name = "hive_buzz_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-shell = "2.4.1"
rand = "0.10.3"
uuid = { version = "1.27.0", features = ["v4"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }
# Captura del micrófono (la misma versión que ya usa rodio para la salida).
cpal = "0.17.3"
semver = "1"
tower-http = { version = "0.7.1", features = ["fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "query"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
sha2 = "0.11.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.1"
csv = "1.4.0"
base64 = "0.23.1"
# HTTPS local para los overlays (TikTok LIVE Studio no acepta URLs http): CA propia restringida a localhost.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
h2 = "0.4"
http = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1.53.2", features = ["test-util", "rt", "macros", "time"] }
